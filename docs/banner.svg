<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="TOEPUNK — Fat-marker Q-brawler">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7e2"/>
      <stop offset="50%" stop-color="#ffe8f4"/>
      <stop offset="100%" stop-color="#e8fff6"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.15" fill="#111111"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#FFF4D6"/>
  <rect width="1200" height="420" fill="url(#grad)"/>
  <rect width="1200" height="420" fill="url(#dots)" opacity="0.45"/>

  <rect x="36" y="36" width="1128" height="348" rx="36" fill="#111111"/>
  <rect x="28" y="28" width="1128" height="348" rx="36" fill="#FF2E93" stroke="#111111" stroke-width="8"/>

  <text x="72" y="88" fill="#FFFFFF" fill-opacity="0.72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="6">SHIPPING LABEL · #TOEPUNK</text>
  <text x="72" y="168" fill="#FFFFFF" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="86">POST THE L.</text>
  <text x="72" y="246" fill="#FFE500" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="72">TOEPUNK</text>
  <text x="72" y="300" fill="#FFFFFF" font-family="Manrope, Nunito, sans-serif" font-size="22">A clay-fisted Q-agent that starts at zero. Train it or it stays dumb.</text>

  <rect x="72" y="322" width="168" height="36" rx="18" fill="#C8FF3D" stroke="#111111" stroke-width="4"/>
  <text x="156" y="346" text-anchor="middle" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">Q-LEARNING</text>

  <rect x="252" y="322" width="132" height="36" rx="18" fill="#20E3FF" stroke="#111111" stroke-width="4"/>
  <text x="318" y="346" text-anchor="middle" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">LIVE TRAIN</text>

  <rect x="396" y="322" width="156" height="36" rx="18" fill="#FFE500" stroke="#111111" stroke-width="4"/>
  <text x="474" y="346" text-anchor="middle" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">STARTS AT 0</text>

  <rect x="980" y="56" width="132" height="132" rx="28" fill="#111111"/>
  <rect x="972" y="48" width="132" height="132" rx="28" fill="#C8FF3D" stroke="#111111" stroke-width="8"/>
  <text x="1038" y="136" text-anchor="middle" fill="#111111" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="88">X</text>
</svg>
